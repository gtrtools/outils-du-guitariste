<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <title>Accordeur de guitare</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #17130f;
      color: #f4ead6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #b6a58c;
      --brass: #d3aa62;
      --paper: #e8d8b8;
      --ink: #342719;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: radial-gradient(ellipse at 50% 0%, #39291b 0, transparent 52%), #17130f;
    }

    main { width: min(100%, 570px); }
    header { text-align: center; margin-bottom: 25px; }
    .eyebrow { color: var(--brass); font-size: .72rem; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
    h1 {
      margin: 8px 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 9vw, 3.6rem);
      font-weight: 500;
      letter-spacing: -.055em;
    }
    header p { margin: 0; color: var(--muted); font-size: .95rem; }

    .tuner {
      padding: 25px clamp(16px, 5vw, 32px) 24px;
      border: 1px solid #654d31;
      border-radius: 20px;
      background: linear-gradient(145deg, #30251a, #211a13 65%);
      box-shadow: 0 22px 75px #0008, inset 0 1px #ffffff12;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      border: 1px solid #57432e;
      border-radius: 12px;
      background: #1b1510;
    }

    .mode-button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .83rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-button[aria-pressed="true"] { background: #51402b; color: #f6e5c4; box-shadow: inset 0 0 0 1px #8a6a3d; }

    .readout { min-height: 96px; padding-top: 13px; text-align: center; }
    .note {
      min-height: 48px;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 2.9rem);
      line-height: 1.15;
      text-shadow: 0 1px #fff8;
    }
    .frequency { min-height: 21px; color: #c4b397; font-size: .82rem; }

    .dial {
      display: block;
      width: min(100%, 440px);
      height: auto;
      margin: -2px auto -8px;
      overflow: visible;
    }
    .dial-face { fill: url(#face); stroke: #bb9253; stroke-width: 5; }
    .dial-inner { fill: none; stroke: #bda77f; stroke-width: 1; opacity: .7; }
    .dial-track { fill: none; stroke: #9d8257; stroke-width: 3; }
    .dial-tick { stroke: #483923; stroke-linecap: round; }
    .dial-tick.major { stroke-width: 2.2; }
    .dial-tick.minor { stroke-width: 1.2; opacity: .7; }
    .dial-caption { fill: #5a4529; font: 700 12px ui-sans-serif, sans-serif; letter-spacing: 1px; }
    .dial-label { fill: #493722; font: 700 14px ui-sans-serif, sans-serif; }
    .needle {
      stroke: #8d3022;
      stroke-width: 4;
      stroke-linecap: round;
      transition: transform 120ms ease-out, stroke 120ms;
      filter: drop-shadow(1px 2px 1px #5a392d88);
    }
    .pivot-outer { fill: #8b672f; stroke: #f0d398; stroke-width: 2; }
    .pivot-inner { fill: #432d17; }

    .status { min-height: 25px; color: #d0bd9e; font-size: .9rem; font-weight: 650; text-align: center; }
    .status.in-tune { color: #d7c17d; }
    .strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin: 17px 0 19px; }
    .string {
      padding: 10px 3px 9px;
      border: 1px solid #5d4931;
      border-radius: 9px;
      background: #1b1510;
      color: var(--muted);
      text-align: center;
    }
    .string strong { display: block; color: #ead9bc; font-size: 1rem; }
    .string span { display: block; margin-top: 3px; font-size: .63rem; }
    .string.active { border-color: var(--brass); background: #493923; }
    .string.active strong { color: #f3d48f; }

    .action-button {
      width: 100%;
      min-height: 50px;
      border: 1px solid #e0bd79;
      border-radius: 11px;
      background: linear-gradient(#d7b878, #b88d4c);
      color: #2e2112;
      font: inherit;
      font-size: .94rem;
      font-weight: 750;
      cursor: pointer;
      box-shadow: inset 0 1px #fff6;
    }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .75; }
    .hint { margin: 14px 0 0; color: var(--muted); font-size: .75rem; line-height: 1.55; text-align: center; }

    .language-switch { margin-top: 12px; }
    .language-switch .mode-button { min-height: 36px; font-size: .78rem; }

    @media (max-width: 390px) {
      .tuner { padding-right: 13px; padding-left: 13px; }
      .note { font-size: clamp(1.7rem, 7vw, 2.4rem); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">L’accord juste, à l’oreille</div>
      <h1>Accordeur</h1>
      <p>La précision d’un accordeur à aiguille.</p>
    </header>

    <section class="tuner" aria-label="Accordeur">
      <div class="mode-switch" role="group" aria-label="Mode d’accordage">
        <button class="mode-button" id="chromatic-mode" type="button" aria-pressed="true">Chromatique</button>
        <button class="mode-button" id="guitar-mode" type="button" aria-pressed="false">Guitare standard</button>
      </div>
      <div class="mode-switch language-switch" role="group" aria-label="Noms des notes">
        <button class="mode-button" id="english-language" type="button" aria-pressed="true">English · C D E</button>
        <button class="mode-button" id="french-language" type="button" aria-pressed="false">Français · Do Ré Mi</button>
      </div>

      <div class="readout" aria-live="polite">
        <div class="note" id="note">—</div>
        <div class="frequency" id="frequency">Joue une note pour commencer</div>
      </div>
      <svg class="dial" viewBox="0 0 400 225" role="img" aria-label="Cadran analogique de justesse">
        <defs>
          <linearGradient id="face" x1="0" x2="0.8" y1="0" y2="1">
            <stop offset="0" stop-color="#f0e2c5"/>
            <stop offset="1" stop-color="#d5bf98"/>
          </linearGradient>
        </defs>
        <circle class="dial-face" cx="200" cy="180" r="169"/>
        <circle class="dial-inner" cx="200" cy="180" r="159"/>
        <path class="dial-track" d="M 69.8 105 A 150 150 0 0 1 330.2 105"/>
        <g id="ticks"></g>
        <text class="dial-label" x="75" y="126">♭</text>
        <text class="dial-label" x="196" y="28">0</text>
        <text class="dial-label" x="316" y="126">♯</text>
        <text class="dial-caption" x="200" y="144" text-anchor="middle">JUSTESSE</text>
        <g id="needle-group" transform="rotate(-90 200 180)">
          <line class="needle" id="needle" x1="200" y1="180" x2="200" y2="51"/>
        </g>
        <circle class="pivot-outer" cx="200" cy="180" r="12"/>
        <circle class="pivot-inner" cx="200" cy="180" r="4"/>
      </svg>
      <div class="status" id="status">Prêt à écouter</div>

      <button class="action-button" id="toggle" type="button">Activer le micro</button>
      <p class="hint" id="hint">Mode chromatique : affiche la note entendue en dièse et en bémol. Autorise le micro, puis joue une note.</p>
    </section>
  </main>

  <script>
    const strings = [
      { note: "E", stringNumber: 6, midi: 40, frequency: 82.41 },
      { note: "A", stringNumber: 5, midi: 45, frequency: 110.00 },
      { note: "D", stringNumber: 4, midi: 50, frequency: 146.83 },
      { note: "G", stringNumber: 3, midi: 55, frequency: 196.00 },
      { note: "B", stringNumber: 2, midi: 59, frequency: 246.94 },
      { note: "E", stringNumber: 1, midi: 64, frequency: 329.63 }
    ];
    const sharpNames = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
    const frenchNames = { C: "Do", D: "Ré", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si" };
    const enharmonics = {
      "C♯": "D♭", "D♯": "E♭", "F♯": "G♭", "G♯": "A♭", "A♯": "B♭"
    };
    const noteDisplay = document.querySelector("#note");
    const frequencyDisplay = document.querySelector("#frequency");
    const statusDisplay = document.querySelector("#status");
    const needleGroup = document.querySelector("#needle-group");
    const button = document.querySelector("#toggle");
    const hintDisplay = document.querySelector("#hint");
    const tuningModeButtons = [...document.querySelectorAll("#chromatic-mode, #guitar-mode")];
    const languageButtons = [...document.querySelectorAll("#english-language, #french-language")];
    const ticksDisplay = document.querySelector("#ticks");
    let mode = "chromatic";
    let language = "english";
    let audioContext;
    let analyser;
    let stream;
    let frameId;
    let buffer;
    let lastAnalysis = 0;
    let latestPitch = null;

    function drawTicks() {
      const svgNamespace = "http://www.w3.org/2000/svg";
      for (let index = 0; index <= 24; index++) {
        const angle = (-150 + index * 5) * Math.PI / 180;
        const major = index % 4 === 0;
        const outerRadius = 153;
        const innerRadius = major ? 132 : 143;
        const tick = document.createElementNS(svgNamespace, "line");
        tick.setAttribute("x1", String(200 + Math.cos(angle) * innerRadius));
        tick.setAttribute("y1", String(180 + Math.sin(angle) * innerRadius));
        tick.setAttribute("x2", String(200 + Math.cos(angle) * outerRadius));
        tick.setAttribute("y2", String(180 + Math.sin(angle) * outerRadius));
        tick.setAttribute("class", `dial-tick ${major ? "major" : "minor"}`);
        ticksDisplay.appendChild(tick);
      }
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelectorAll("#chromatic-mode, #guitar-mode").forEach(modeButton => {
        modeButton.setAttribute("aria-pressed", String(modeButton.id === `${mode}-mode`));
      });
      hintDisplay.textContent = mode === "chromatic"
        ? "Mode chromatique : affiche la note entendue en dièse et en bémol. Autorise le micro, puis joue une note."
        : "Mode guitare : affiche E6, A5, D4, G3, B2 ou E1 selon la corde standard détectée.";
      if (latestPitch !== null) showPitch(latestPitch);
    }

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      languageButtons.forEach(languageButton => {
        languageButton.setAttribute("aria-pressed", String(languageButton.id === `${language}-language`));
      });
      if (latestPitch !== null) showPitch(latestPitch);
    }

    function formatNote(note) {
      if (language === "english") return note;
      const match = note.match(/^([A-G])([♯♭]?)$/);
      return match ? `${frenchNames[match[1]]}${match[2]}` : note;
    }

    function detectPitch(samples, sampleRate) {
      let rms = 0;
      for (let i = 0; i < samples.length; i++) rms += samples[i] * samples[i];
      rms = Math.sqrt(rms / samples.length);
      if (rms < 0.012) return null;

      let bestLag = 0;
      let bestCorrelation = 0;
      const minFrequency = mode === "chromatic" ? 1000 : 370;
      const maxFrequency = mode === "chromatic" ? 55 : 75;
      const minLag = Math.floor(sampleRate / minFrequency);
      const maxLag = Math.min(Math.floor(sampleRate / maxFrequency), samples.length - 2);
      for (let lag = minLag; lag <= maxLag; lag++) {
        let correlation = 0;
        const limit = samples.length - lag;
        for (let i = 0; i < limit; i++) correlation += samples[i] * samples[i + lag];
        correlation /= limit;
        if (correlation > bestCorrelation) {
          bestCorrelation = correlation;
          bestLag = lag;
        }
      }

      if (!bestLag) return null;
      const previous = bestLag > minLag ? correlationAt(samples, bestLag - 1) : bestCorrelation;
      const next = bestLag < maxLag ? correlationAt(samples, bestLag + 1) : bestCorrelation;
      const adjustment = 0.5 * (previous - next) / (previous - 2 * bestCorrelation + next || 1);
      return sampleRate / (bestLag + adjustment);
    }

    function correlationAt(samples, lag) {
      let correlation = 0;
      const limit = samples.length - lag;
      for (let i = 0; i < limit; i++) correlation += samples[i] * samples[i + lag];
      return correlation / limit;
    }

    function showPitch(pitch) {
      const midi = 69 + 12 * Math.log2(pitch / 440);
      const nearestMidi = Math.round(midi);
      let cents;
      let activeString = null;

      if (mode === "guitar") {
        activeString = strings.reduce((closest, string) => {
          const stringCents = 1200 * Math.log2(pitch / string.frequency);
          return Math.abs(stringCents) < Math.abs(1200 * Math.log2(pitch / closest.frequency))
            ? string
            : closest;
        }, strings[0]);
        cents = Math.round(1200 * Math.log2(pitch / activeString.frequency));
        const stringName = language === "english" ? activeString.note : frenchNames[activeString.note];
        noteDisplay.textContent = `${stringName}${activeString.stringNumber}`;
      } else {
        cents = Math.round((midi - nearestMidi) * 100);
        const sharpName = sharpNames[(nearestMidi % 12 + 12) % 12];
        const noteName = enharmonics[sharpName]
          ? `${formatNote(sharpName)} / ${formatNote(enharmonics[sharpName])}`
          : formatNote(sharpName);
        noteDisplay.textContent = noteName;
      }

      const deviation = Math.max(-50, Math.min(50, cents));
      const angle = -90 + deviation * 1.2;
      const inTune = Math.abs(cents) <= 5;
      const signedCents = cents > 0 ? `+${cents}` : String(cents);
      frequencyDisplay.textContent = `${pitch.toFixed(1)} Hz · ${signedCents} cents`;
      statusDisplay.textContent = inTune
        ? "Parfaitement accordée"
        : cents < 0 ? "Trop grave — tends légèrement" : "Trop aiguë — détends légèrement";
      statusDisplay.classList.toggle("in-tune", inTune);
      needleGroup.setAttribute("transform", `rotate(${angle} 200 180)`);
      document.querySelector(".needle").style.stroke = inTune ? "#466039" : "#8d3022";
    }

    function update() {
      if (performance.now() - lastAnalysis >= 75) {
        analyser.getFloatTimeDomainData(buffer);
        const pitch = detectPitch(buffer, audioContext.sampleRate);
        if (pitch && Number.isFinite(pitch)) {
          latestPitch = pitch;
          showPitch(pitch);
        } else {
          latestPitch = null;
          noteDisplay.textContent = "—";
          frequencyDisplay.textContent = "Joue une note pour commencer";
          statusDisplay.textContent = "À l’écoute…";
          statusDisplay.classList.remove("in-tune");
          needleGroup.setAttribute("transform", "rotate(-90 200 180)");
        }
        lastAnalysis = performance.now();
      }
      frameId = requestAnimationFrame(update);
    }

    async function startTuner() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDisplay.textContent = "Le micro nécessite une connexion sécurisée (HTTPS ou localhost).";
        return;
      }
      button.disabled = true;
      statusDisplay.textContent = "Demande d’accès au micro…";
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0;
        audioContext.createMediaStreamSource(stream).connect(analyser);
        buffer = new Float32Array(analyser.fftSize);
        lastAnalysis = 0;
        button.textContent = "Désactiver le micro";
        button.disabled = false;
        update();
      } catch (error) {
        if (stream) stream.getTracks().forEach(track => track.stop());
        if (audioContext) audioContext.close();
        stream = null;
        audioContext = null;
        statusDisplay.textContent = error.name === "NotAllowedError"
          ? "Accès au micro refusé. Autorise-le dans les réglages du navigateur."
          : "Impossible d’accéder au micro. Vérifie qu’il est disponible.";
        button.disabled = false;
      }
    }

    function stopTuner() {
      cancelAnimationFrame(frameId);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (audioContext) audioContext.close();
      stream = null;
      audioContext = null;
      latestPitch = null;
      button.textContent = "Activer le micro";
      noteDisplay.textContent = "—";
      frequencyDisplay.textContent = "Joue une note pour commencer";
      statusDisplay.textContent = "Prêt à écouter";
      statusDisplay.classList.remove("in-tune");
      needleGroup.setAttribute("transform", "rotate(-90 200 180)");
    }

    button.addEventListener("click", () => {
      if (stream) stopTuner();
      else startTuner();
    });
    tuningModeButtons.forEach(modeButton => modeButton.addEventListener("click", () => {
      setMode(modeButton.id === "guitar-mode" ? "guitar" : "chromatic");
    }));
    languageButtons.forEach(languageButton => languageButton.addEventListener("click", () => {
      setLanguage(languageButton.id === "french-language" ? "french" : "english");
    }));
    drawTicks();
    setMode("chromatic");
    setLanguage("english");
  </script>
</body>
</html>
